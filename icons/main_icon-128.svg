<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="128" height="128">
  <!-- Dark slate background -->
  <rect width="48" height="48" rx="11" fill="#1E293B"/>

  <!-- Address bar (URL bar shape) -->
  <rect x="8" y="9" width="32" height="9" rx="4.5" fill="none" stroke="white" stroke-width="1.8" opacity="0.9"/>
  <!-- Favicon dot inside address bar -->
  <circle cx="14" cy="13.5" r="1.8" fill="white" opacity="0.7"/>
  <!-- URL line stub -->
  <line x1="19" y1="13.5" x2="33" y2="13.5" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Clock face -->
  <circle cx="24" cy="32" r="9" fill="none" stroke="white" stroke-width="1.8" opacity="0.9"/>
  <!-- Minute hand (pointing to 12) -->
  <line x1="24" y1="32" x2="24" y2="25.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Hour hand (pointing to ~4) -->
  <line x1="24" y1="32" x2="28.5" y2="35" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="24" cy="32" r="1.5" fill="white"/>
</svg>
